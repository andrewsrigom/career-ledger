name: Verify Career Ledger

on:
  pull_request:
  push:
    branches:
      - main
      - portfolio-interactive-redesign

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Run validation, privacy audit, tests, and build
        run: npm run check
        env:
          SITE_URL: https://example.github.io
          BASE_PATH: /career-ledger
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Verify public browser behavior
        run: |
          npm run check:browser
          CAREER_BROWSER_BASE_PATH=/career-ledger npm run check:browser
          CAREER_BROWSER_BASE_PATH=/test-repository npm run check:browser
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
