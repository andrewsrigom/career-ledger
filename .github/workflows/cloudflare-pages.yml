name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: I approve manually redeploying the current main revision to andrewsrigom.pages.dev.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_publication == true))
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://andrewsrigom.pages.dev
    env:
      SITE_URL: https://andrewsrigom.pages.dev
      BASE_PATH: /
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out the approved main revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Validate, audit, type-check, test, and build public content
        run: npm run check
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Verify the complete public site
        run: |
          npm run check:browser
          CAREER_BROWSER_BASE_PATH=/career-ledger npm run check:browser
          CAREER_BROWSER_BASE_PATH=/test-repository npm run check:browser
      - name: Rebuild with the production canonical URL
        run: npm run build
      - name: Retain the verified release for rollback
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-public-site-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Publish the approved build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Configure the Cloudflare Pages Edit deployment secret first."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Configure the Cloudflare account secret first."; exit 1; }
          npx --no-install wrangler pages deploy dist --project-name andrewsrigom --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false
