name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: I reviewed the local preview and approve publishing the approved content on main.
        required: true
        default: false
        type: boolean
      source_commit:
        description: Optional full commit SHA from main history for an explicitly approved rollback. Leave empty to publish current main.
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.confirm_publication == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select an approved rollback revision
        if: inputs.source_commit != ''
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "A full commit SHA is required."; exit 1; }
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          git checkout --detach "$SOURCE_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install pinned dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; fi

      - name: Configure deployment URL
        env:
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
          CUSTOM_BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          site_url="${CUSTOM_SITE_URL:-https://${GITHUB_REPOSITORY_OWNER}.github.io}"

          if [ -n "$CUSTOM_BASE_PATH" ]; then
            base_path="$CUSTOM_BASE_PATH"
          elif [ "$repository_name" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            base_path=""
          else
            base_path="/$repository_name"
          fi

          echo "SITE_URL=$site_url" >> "$GITHUB_ENV"
          echo "BASE_PATH=$base_path" >> "$GITHUB_ENV"

      - name: Verify and build
        run: npm run check
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Retain the verified public build for rollback review
        uses: actions/upload-artifact@v7
        with:
          name: public-site-${{ github.run_id }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
