name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Configure deployment URL
        env:
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
          CUSTOM_BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          site_url="${CUSTOM_SITE_URL:-https://${GITHUB_REPOSITORY_OWNER}.github.io}"

          if [ -n "$CUSTOM_BASE_PATH" ]; then
            base_path="$CUSTOM_BASE_PATH"
          elif [ "$repository_name" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            base_path=""
          else
            base_path="/$repository_name"
          fi

          echo "SITE_URL=$site_url" >> "$GITHUB_ENV"
          echo "BASE_PATH=$base_path" >> "$GITHUB_ENV"

      - name: Verify and build
        run: npm run check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
